name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Native sources are git submodules upstream. If your repo does not carry them
  # (e.g. you pushed a plain copy of the files), the workflow clones them from here.
  BYEDPI_REPO: https://github.com/hufrea/byedpi.git
  BYEDPI_REF: v0.13          # upstream docs link points at v0.13
  HEV_REPO: https://github.com/heiher/hev-socks5-tunnel.git
  HEV_REF: ""                # empty = default branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # only needed to attach APKs to a GitHub Release on tags
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch native sources when submodules are missing
        run: |
          set -e
          fetch() {
            dir="$1"; url="$2"; ref="$3"
            if [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "::notice::$dir is empty, cloning $url ${ref:+@ $ref}"
              rm -rf "$dir"
              git clone --recursive "$url" "$dir"
              if [ -n "$ref" ]; then
                (cd "$dir" && git checkout "$ref" && git submodule update --init --recursive) \
                  || echo "::warning::could not check out $ref in $dir, using default branch"
              fi
            else
              echo "$dir already present"
            fi
          }
          fetch app/src/main/cpp/byedpi "$BYEDPI_REPO" "$BYEDPI_REF"
          fetch app/src/main/jni/hev-socks5-tunnel "$HEV_REPO" "$HEV_REF"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tooling
        uses: android-actions/setup-android@v3
        with:
          # The action's default ("tools platform-tools") fails: the legacy "tools" package no longer exists.
          # We install what we need ourselves in the next step.
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install SDK packages
        run: |
          set +e
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[67]" 
          sdkmanager "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
          # Material3 1.5.0-alpha29 / Compose 1.13 alphas need compileSdk 37.1
          sdkmanager "platforms;android-37.1" || sdkmanager "platforms;android-37"
          true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ByeDPI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ByeDPI-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
